name: Pull Request Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: |
          echo "Running ESLint..."
          if npm run lint 2>&1 | tee eslint-output.txt; then
            echo "eslint_status=passed" >> $GITHUB_OUTPUT
            echo "eslint_result=✅ ESLint checks passed" >> $GITHUB_OUTPUT
          else
            echo "eslint_status=failed" >> $GITHUB_OUTPUT
            echo "eslint_result=❌ ESLint found issues" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Run Prettier check
        id: prettier
        run: |
          echo "Running Prettier..."
          if npx prettier --check . 2>&1 | tee prettier-output.txt; then
            echo "prettier_status=passed" >> $GITHUB_OUTPUT
            echo "prettier_result=✅ Prettier formatting is correct" >> $GITHUB_OUTPUT
          else
            echo "prettier_status=failed" >> $GITHUB_OUTPUT
            echo "prettier_result=❌ Prettier found formatting issues" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Post Code Quality Report
        uses: actions/github-script@v7
        with:
          script: |
            const eslintResult = '${{ steps.eslint.outputs.eslint_result }}' || 'ESLint check completed';
            const prettierResult = '${{ steps.prettier.outputs.prettier_result }}' || 'Prettier check completed';
            
            const comment = `## Code Quality Report
            
            ### ESLint
            ${eslintResult}
            
            ### Prettier
            ${prettierResult}
            
            ---
            *Automated code quality check completed*`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Code Quality Report')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  testing-suite:
    name: testing-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        id: test
        run: |
          echo "Running test suite..."
          if npm test -- --coverage 2>&1 | tee test-output.txt; then
            echo "test_status=passed" >> $GITHUB_OUTPUT
            echo "test_result=✅ All tests passed" >> $GITHUB_OUTPUT
          else
            echo "test_status=failed" >> $GITHUB_OUTPUT
            echo "test_result=❌ Some tests failed" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Generate coverage summary
        id: coverage
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -e "const c=require('./coverage/coverage-summary.json'); const t=c.total; console.log(\`Lines: \${t.lines.pct}% | Statements: \${t.statements.pct}% | Functions: \${t.functions.pct}% | Branches: \${t.branches.pct}%\`)")
            echo "coverage_summary=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "coverage_summary=Coverage report not available" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.run_number }}
          path: coverage/
          retention-days: 30

      - name: Post Test Coverage Report
        uses: actions/github-script@v7
        with:
          script: |
            const testResult = '${{ steps.test.outputs.test_result }}' || 'Test execution completed';
            const coverageSummary = '${{ steps.coverage.outputs.coverage_summary }}' || 'No coverage data';
            
            const comment = `## Test Coverage Report
            
            ${testResult}
            
            ### Coverage Summary
            ${coverageSummary}
            
            ---
            *Coverage artifacts uploaded for this run*`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Test Coverage Report')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        run: |
          echo "Checking for vulnerabilities..."
          if npm audit --audit-level=moderate 2>&1 | tee audit-output.txt; then
            echo "vuln_status=passed" >> $GITHUB_OUTPUT
            echo "vuln_result=✅ No vulnerabilities found in Dependencies" >> $GITHUB_OUTPUT
          else
            VULNS=$(grep -c "vulnerabilities" audit-output.txt || echo "unknown")
            echo "vuln_status=warning" >> $GITHUB_OUTPUT
            echo "vuln_result=⚠️ Vulnerabilities detected in Dependencies - review audit report" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Scan for secrets
        id: secrets
        run: |
          echo "Scanning for secrets..."
          # Basic secret scanning pattern
          if git diff origin/main...HEAD | grep -iE "(password|secret|key|token|api_key).*=.*['\"][^'\"]{10,}" > secrets-found.txt || true; then
            if [ -s secrets-found.txt ]; then
              echo "secrets_status=failed" >> $GITHUB_OUTPUT
              echo "secrets_result=❌ Potential secrets detected in code changes" >> $GITHUB_OUTPUT
            else
              echo "secrets_status=passed" >> $GITHUB_OUTPUT
              echo "secrets_result=✅ No secrets detected" >> $GITHUB_OUTPUT
            fi
          else
            echo "secrets_status=passed" >> $GITHUB_OUTPUT
            echo "secrets_result=✅ No secrets detected" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Post Security Scan Report
        uses: actions/github-script@v7
        with:
          script: |
            const vulnResult = '${{ steps.audit.outputs.vuln_result }}' || 'Dependency check completed';
            const secretsResult = '${{ steps.secrets.outputs.secrets_result }}' || 'Secret scan completed';
            
            const comment = `## Security Scan Report
            
            ### Vulnerabilities
            ${vulnResult}
            
            ### Secrets Scan
            ${secretsResult}
            
            ### Dependencies
            Security audit completed for all project dependencies.
            
            ---
            *Automated security scan completed*`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Security Scan Report')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  build-validation:
    name: build-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        id: build
        run: |
          echo "Building application..."
          if npm run build 2>&1 | tee build-output.txt; then
            echo "build_status=passed" >> $GITHUB_OUTPUT
            echo "build_result=✅ Build completed successfully" >> $GITHUB_OUTPUT
          else
            echo "build_status=failed" >> $GITHUB_OUTPUT
            echo "build_result=❌ Build failed" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Validate endpoints
        id: validate
        run: |
          echo "Validating endpoints..."
          # Check if there's a start script or server file
          if [ -f "package.json" ]; then
            if grep -q '"start"' package.json || [ -f "server.js" ] || [ -f "app.js" ] || [ -f "index.js" ]; then
              echo "validate_result=✅ Application endpoints configured" >> $GITHUB_OUTPUT
            else
              echo "validate_result=⚠️ No start script found" >> $GITHUB_OUTPUT
            fi
          else
            echo "validate_result=⚠️ Validation skipped" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Create deployment preview
        run: |
          mkdir -p preview
          echo "Preview build for PR #${{ github.event.pull_request.number }}" > preview/info.txt
          echo "Commit: ${{ github.sha }}" >> preview/info.txt
          echo "Built at: $(date)" >> preview/info.txt
          if [ -d "dist" ]; then cp -r dist/* preview/ 2>/dev/null || true; fi
          if [ -d "build" ]; then cp -r build/* preview/ 2>/dev/null || true; fi

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-preview-${{ github.event.pull_request.number }}
          path: preview/
          retention-days: 7

      - name: Post Build Validation
        uses: actions/github-script@v7
        with:
          script: |
            const buildResult = '${{ steps.build.outputs.build_result }}' || 'Build completed';
            const validateResult = '${{ steps.validate.outputs.validate_result }}' || 'Validation completed';
            
            const comment = `## Build Validation
            
            ${buildResult}
            
            ### Endpoints
            ${validateResult}
            
            ### Deployment Preview
            Preview artifacts have been generated and are available for download.
            
            ---
            *Build validation completed*`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Build Validation')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }